#
name: CHICKEN Scheme Docker image, aux modules.

# Every push to master builds two images for linux/amd64 and linux/arm64: the aux image (Dockerfile: CHICKEN with the
# aux modules installed and tested) and, on top of it, the playable Dice of Doom (Dockerfile.dice-of-doom), published
# as ghcr.io/<owner>/aux.scm and ghcr.io/<owner>/aux.scm/dice-of-doom. Each platform is built natively on its own
# runner and pushed by digest, as in chicken-core's workflow; the merge job then joins the two digests of each image
# in one multi-platform tag and attests it.
on:
    push:
        branches: ["master"]

# Defines two custom environment variables for the workflow. These are used for the Container registry domain, and a name for the Docker image that this workflow builds.
env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                platform:
                    - { name: linux/amd64, arch: amd64, runner: ubuntu-24.04 }
                    - { name: linux/arm64, arch: arm64, runner: ubuntu-24.04-arm }
        runs-on: ${{ matrix.platform.runner }}

        # Sets the permissions granted to the `GITHUB_TOKEN` for the actions in this job.
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
            # Uses the `docker/login-action` action to log in to the Container registry registry using the account and password that will publish the packages. Once published, the packages are scoped to the account defined here.
            - name: Log in to the Container registry
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            # This step uses [docker/metadata-action](https://github.com/docker/metadata-action#about) to extract the labels that will be applied to the images of this platform; the tags are made by the merge job.
            - name: Extract metadata (labels) for Docker
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

            - name: Extract metadata (labels) for the Dice of Doom image
              id: meta-dice-of-doom
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/dice-of-doom

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            # The aux image of this platform, pushed by digest only. The Dockerfile builds and runs the test suite, so a
            # platform whose tests fail publishes nothing.
            - name: Build and push Docker image by digest
              id: push
              uses: docker/build-push-action@v7
              with:
                  context: .
                  platforms: ${{ matrix.platform.name }}
                  labels: ${{ steps.meta.outputs.labels }}
                  outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

            # The playable Dice of Doom of this platform, on the image just pushed, pinned by its digest.
            - name: Build and push the Dice of Doom image by digest
              id: push-dice-of-doom
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: Dockerfile.dice-of-doom
                  platforms: ${{ matrix.platform.name }}
                  build-args: BASE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
                  labels: ${{ steps.meta-dice-of-doom.outputs.labels }}
                  outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/dice-of-doom,push-by-digest=true,name-canonical=true,push=true

            - name: Record the digests
              env:
                  AUX_DIGEST: ${{ steps.push.outputs.digest }}
                  DICE_OF_DOOM_DIGEST: ${{ steps.push-dice-of-doom.outputs.digest }}
              run: |
                  mkdir -p "$RUNNER_TEMP/digests/aux" "$RUNNER_TEMP/digests/dice-of-doom"
                  touch "$RUNNER_TEMP/digests/aux/${AUX_DIGEST#sha256:}"
                  touch "$RUNNER_TEMP/digests/dice-of-doom/${DICE_OF_DOOM_DIGEST#sha256:}"

            - name: Upload the digests
              uses: actions/upload-artifact@v4
              with:
                  name: digests-${{ matrix.platform.arch }}
                  path: ${{ runner.temp }}/digests
                  if-no-files-found: error
                  retention-days: 1

    merge:
        needs: build
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                image:
                    - { name: aux, suffix: "" }
                    - { name: dice-of-doom, suffix: "/dice-of-doom" }

        permissions:
            contents: read
            packages: write
            attestations: write
            id-token: write

        steps:
            - name: Download the digests
              uses: actions/download-artifact@v4
              with:
                  path: ${{ runner.temp }}/digests
                  pattern: digests-*
                  merge-multiple: true

            - name: Log in to the Container registry
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Extract metadata (tags) for Docker
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.image.suffix }}

            - name: Create the multi-platform tags
              id: tags
              working-directory: ${{ runner.temp }}/digests/${{ matrix.image.name }}
              env:
                  IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.image.suffix }}
                  VERSION: ${{ steps.meta.outputs.version }}
              run: |
                  docker buildx imagetools create \
                    $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
                    $(printf "$IMAGE@sha256:%s " *)
                  docker buildx imagetools inspect "$IMAGE:$VERSION"
                  echo "digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"

            # This step generates an artifact attestation for the image, which is an unforgeable statement about where and how it was built. It increases supply chain security for people who consume the image. For more information, see [Using artifact attestations to establish provenance for builds](/actions/security-guides/using-artifact-attestations-to-establish-provenance-for-builds).
            - name: Generate artifact attestation
              uses: actions/attest-build-provenance@v4
              with:
                  subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.image.suffix }}
                  subject-digest: ${{ steps.tags.outputs.digest }}
                  push-to-registry: true
